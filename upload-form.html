<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSV Upload Test</title>
</head>
<body>
    <div>
        <h1>Upload CSV File</h1>
        <p>Select a CSV file to upload to <code>POST /upload</code></p>
        
        <form id="uploadForm" action="/upload" method="post" enctype="multipart/form-data">
            <input type="file" id="fileInput" name="file" accept=".csv" required>
            <button type="submit">Upload</button>
        </form>
        <div id="result"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('uploadForm');
            const fileInput = document.getElementById('fileInput');
            const resultDiv = document.getElementById('result');

            if (!form) return; // safety

            form.addEventListener('submit', async (e) => {
                e.preventDefault();

                if (!fileInput.files[0]) {
                    alert('Please select a file');
                    return;
                }

                const formData = new FormData();
                formData.append('file', fileInput.files[0]);

                try {
                    resultDiv.style.display = 'block';
                    resultDiv.className = '';
                    resultDiv.innerHTML = '<p>Uploading...</p>';

                    const response = await fetch('/upload', {
                        method: 'POST',
                        body: formData
                    });

                    const data = await response.json();

                    if (response.ok) {
                        resultDiv.innerHTML = `
                            <h3>✅ Upload Successful!</h3>
                            <p><strong>Stored:</strong> ${data.stored} products</p>
                            <p><strong>Failed:</strong> ${data.failed.length} products</p>
                            ${data.failed.length > 0 ? `<pre>${JSON.stringify(data.failed, null, 2)}</pre>` : ''}
                        `;
                    } else {
                        throw new Error(data.error || 'Upload failed');
                    }
                } catch (error) {
                    resultDiv.style.display = 'block';
                    resultDiv.className = 'error';
                    resultDiv.innerHTML = `
                        <h3>❌ Upload Failed</h3>
                        <p>${error.message}</p>
                    `;
                }
            });
        });
    </script>
</body>
</html>
